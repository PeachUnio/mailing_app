{% extends "base.html" %}
{% block content %}
    <div class="col-12">
        <div class="container mt-5">
            <div class="row">
                <div class="col-2"></div>
                <div class="col-8">
                    <div class="card">
                        <div class="card-body">
                            <form method="post" enctype="multipart/form-data">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <button type="submit" class="btn btn-primary">
                                    Войти
                                </button>
                                <div class="mt-3">
                                    <a href="{% url 'users:password-reset' %}">Забыли пароль?</a>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
                <div class="col-2"></div>
            </div>
        </div>
    </div>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Рассылки{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'mailing:home' %}">Рассылки</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'mailing:home' %}">Главная</a>
                <a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a>
                <a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a>
                <a class="nav-link" href="{% url 'mailing:recipient_list' %}">Получатели</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>

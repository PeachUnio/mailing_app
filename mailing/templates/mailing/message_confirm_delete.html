{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Удаление сообщения</h3>
                </div>

                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить сообщение?</p>
                    <p><strong>Тема:</strong> {{ object.letter_theme }}</p>
                    <p><strong>Содержание:</strong> {{ object.letter_body|truncatechars:100 }}</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                            <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

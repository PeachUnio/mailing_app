{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Удаление получателя</h3>
                </div>

                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить получателя?</p>
                    <p><strong>Имя:</strong> {{ object.name }}</p>
                    <p><strong>Email:</strong> {{ object.email }}</p>
                    {% if object.comment %}
                    <p><strong>Комментарий:</strong> {{ object.comment|truncatechars:100 }}</p>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                            <a href="{% url 'mailing:recipient_list' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
